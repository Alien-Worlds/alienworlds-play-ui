name: Release Tag

# Tags the version in package.json on every push to main.
#
# The version is bumped by hand on the release/x.y.z branch (package.json and
# the sidebar footer), so this workflow only tags what was merged. If the tag
# for the current version already exists, the run is a no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so concurrent pushes can't race on the same tag.
concurrency:
  group: release-tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Create and push tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

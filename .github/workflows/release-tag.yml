name: Release Tag

# Auto-bumps the version and tags it on every push to main.
#
# Versioning scheme (single-digit patch/minor, 0-9):
#   patch += 1
#   patch > 9  -> patch = 0, minor += 1
#   minor > 9  -> minor = 0, major += 1
# e.g. 5.2.9 -> 5.3.0, 5.9.9 -> 6.0.0

on:
  push:
    branches: [main]

# Serialize releases so concurrent pushes can't compute the same next version.
concurrency:
  group: release-tag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own version-bump commit.
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, 'chore(release): bump version to')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          current_version=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$current_version"

          patch=$((patch + 1))
          if [ "$patch" -gt 9 ]; then
            patch=0
            minor=$((minor + 1))
          fi
          if [ "$minor" -gt 9 ]; then
            minor=0
            major=$((major + 1))
          fi

          new_version="$major.$minor.$patch"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumping $current_version -> $new_version"

      - name: Update package.json version
        run: npm pkg set version="${{ steps.version.outputs.new_version }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.new_version }}"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          new_version="${{ steps.version.outputs.new_version }}"
          git tag -a "v$new_version" -m "Release v$new_version"
          git push origin "v$new_version"
